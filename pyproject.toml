[project]
name = "framecraft"
version = "0.1.0"
description = "Local video generator: React UI calling a FastAPI backend"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "omnivoice>=0.2,<0.3",
    "transformers>=5.3",
    "accelerate",
    "huggingface_hub",
    "imageio-ffmpeg==0.7.0",
    "fastapi",
    "uvicorn",
    "yt-dlp[default,deno]>=2026.10.26",
    "mlx-vlm==0.7.11 ; sys_platform == 'darwin'",
    "bitsandbytes==0.50.2 ; sys_platform == 'win32'",
    "pythainlp==5.4.0",
    "diffusers==0.42.1",
    "gguf==0.19.0",
    "pillow==12.3.0",
    "soundfile==0.14.0",
    "onnxruntime==1.32.0",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest]
testpaths = ["backend/tests"]
pythonpath = ["."]
strict = true
